name: affiliate_wallet
description: ShareWallet - plataforma de afiliados com carteira digital e pagamentos via Pix
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: 6.1.5+1

  # HTTP client
  http: 1.5.0

  # Local storage
  shared_preferences: 2.5.3
  hive: 2.2.3
  hive_flutter: 1.1.0

  # Firebase
  firebase_core: 3.6.0
  firebase_auth: 5.3.1
  cloud_firestore: 5.4.3
  google_sign_in: ^6.2.1
  flutter_facebook_auth: ^7.0.1

  # UI
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  fl_chart: ^0.69.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  path_provider: ^2.1.4
  qr_flutter: ^4.1.0
  package_info_plus: ^8.3.0

  # Foto de perfil
  image_picker: 1.1.2
  firebase_storage: 12.3.2

  # Biometria (digital/face) + credenciais seguras
  local_auth: 2.3.0
  flutter_secure_storage: 9.2.4

  # WebView shell (APK abre o site igual PWA)
  webview_flutter: 4.13.0

  # JS interop moderno (transitive via flutter_web_plugins, declarado explicitamente)
  web: 1.1.1



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icon/

  fonts:
    - family: NotoColorEmoji
      fonts:
        - asset: assets/fonts/NotoColorEmoji.ttf
