  <script>
    // Desregistra TODOS os Service Workers e limpa TODOS os caches do browser.
    // O Service Worker do Flutter causa "prepareServiceWorker took more than 4000ms"
    // quando uma nova versão do app é deployada (SW antigo ainda está ativo).
    // Solução: desabilitar SW completamente — o Cloudflare Pages já serve os arquivos
    // atualizados com Cache-Control: no-store, sem precisar de SW.
    (function() {
      if ('serviceWorker' in navigator) {
        // Desregistra todos os SWs registrados
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          registrations.forEach(function(r) { r.unregister(); });
        });
        // Bloqueia novos registros substituindo a API (patched pelo flutter_bootstrap.js,
        // mas o patch_build.py já remove serviceWorkerSettings antes do deploy)
      }
      // Limpa todos os caches (flutter e outros)
      if ('caches' in window) {
        caches.keys().then(function(names) {
          names.forEach(function(name) { caches.delete(name); });
        });
      }
    })();
  </script>

  <script>
    // Bloqueia window.open() do Firebase Auth em ambientes com COOP: same-origin.
    // O Firebase SDK abre popups OAuth e faz polling de popup.closed, o que dispara
    // "Cross-Origin-Opener-Policy policy would block the window.closed call" no Chrome.
    // Como o Dart ja usa signInWithRedirect nesses ambientes, nenhum popup OAuth e
    // necessario. Substituimos window.open por um stub com closed=true, fazendo o
    // SDK desistir imediatamente do popup sem disparar COOP.
    (function() {
      var _isCOOPEnv = (
        window.location.hostname.indexOf('sandbox.novita') !== -1 ||
        window.location.hostname.indexOf('genspark')       !== -1 ||
        window.location.hostname.indexOf('pages.dev')      !== -1 ||
        window.location.hostname.indexOf('netlify')        !== -1 ||
        window.location.hostname.indexOf('vercel')         !== -1
      );
      if (_isCOOPEnv) {
        var _origOpen = window.open.bind(window);
        window.open = function(url, name, features) {
          if (url && typeof url === 'string' &&
              (url.indexOf('accounts.google.com') !== -1 ||
               url.indexOf('facebook.com/dialog') !== -1 ||
               url.indexOf('appleid.apple.com')   !== -1 ||
               url.indexOf('/__/auth/')            !== -1)) {
            return { closed: true, close: function(){}, focus: function(){},
                     postMessage: function(){}, location: { href: '' } };
          }
          return _origOpen(url, name, features);
        };
      }
    })();
  </script>

  <!-- MercadoPago.JS V2 SDK  -  obrigatório para device_id e Secure Fields (PCI Compliance) -->
  <!-- Requisito do Quality Score MP: SDK do frontend + Identificador do dispositivo -->
  <script src="https://sdk.mercadopago.com/js/v2"></script>
  <script>
    // Inicializa MP SDK V2 com public key de produção.
    // O SDK gera automaticamente um session fingerprint (device_id) logo após a
    // instanciação. Esse id é lido pelo Flutter via dart:html e enviado no header
    // X-Device-Session-Id de cada pagamento  -  campo obrigatório para o Quality Score.
    (function initMpSdk() {
      // Mesma public_key usada no defaultConfig() do Dart (MpConfig.defaultConfig)
      var MP_PUBLIC_KEY = 'APP_USR-1ca2945d-477b-4691-8976-8a27dc2e806e';

      function tryInit() {
        if (typeof MercadoPago === 'undefined') return;
        try {
          window._mpInstance = new MercadoPago(MP_PUBLIC_KEY, { locale: 'pt-BR' });

          // Aguarda o SDK popular o MP_DEVICE_SESSION_ID (pode levar até 2s)
          var polls = 0;
          var timer = setInterval(function() {
            polls++;
            var sid = window.MP_DEVICE_SESSION_ID
                   || (window._mpInstance && window._mpInstance.deviceSessionId);
            if (sid) {
              // Normaliza: garante que window.MP_DEVICE_SESSION_ID esteja preenchido
              window.MP_DEVICE_SESSION_ID = sid;
              clearInterval(timer);
            } else if (polls >= 20) {
              // Timeout de 4s  -  gera um fallback local para não bloquear o checkout
              window.MP_DEVICE_SESSION_ID = 'sw_' + Date.now() + '_' + Math.random().toString(36).slice(2);
              clearInterval(timer);
            }
          }, 200);
        } catch(e) { /* SDK não carregado  -  checkout funciona sem device_id */ }
      }

      // Tenta agora; se o script ainda não foi parseado, tenta novamente após load
      tryInit();
      if (typeof MercadoPago === 'undefined') {
        window.addEventListener('load', tryInit);
      }
    })();
  </script>

  <!--
    Deep link handler: lê o hash da URL ANTES do Flutter carregar
    e grava no sessionStorage para o Dart ler via dart:js.

    URL esperada: /app/#/produto/p_xxx?ref=CODE
    window.location.hash -> "#/produto/p_xxx?ref=CODE"
  -->
  <script>
    (function() {
      try {
        var hash = window.location.hash; // "#/produto/p_xxx?ref=CODE"

        // ── PWA Standalone: detecta abertura pelo ícone do app ───────────────
        // Se o app está instalado (standalone) e o hash aponta para /landing,
        // limpamos o sessionStorage e redirecionamos para '/' ANTES do Flutter
        // iniciar. O SplashScreen cuida do resto (localStorage UID → home/login).
        var isStandalone = window.matchMedia('(display-mode: standalone)').matches
                        || navigator.standalone === true;

        if (isStandalone) {
          var isLanding = !hash || hash === '#' || hash === '#/' || hash.indexOf('/landing') !== -1;
          if (isLanding) {
            // Remove da sessionStorage qualquer rota de landing gravada antes
            try { sessionStorage.removeItem('flutter_initial_route'); } catch(e2) {}
            // Força hash para raiz → SplashScreen decide home/login
            window.location.replace(window.location.pathname + window.location.search + '#/');
            return; // não grava sessionStorage com /landing
          }
        }
        // ─────────────────────────────────────────────────────────────────────

        if (hash && hash.length > 1) {
          // Remove o "#" inicial
          var fragment = hash.substring(1); // "/produto/p_xxx?ref=CODE"
          // Guarda no sessionStorage para o Dart ler
          sessionStorage.setItem('flutter_initial_route', fragment);
        }
      } catch(e) {}
    })();
  </script>

  <script>
    // Suprime o warning "Could not find a set of Noto fonts" do Flutter CanvasKit.
    // Este warning e inofensivo: ocorre quando dados dinamicos (API/Firestore)
    // contem caracteres Unicode (ex: em-dash, aspas tipograficas, setas)
    // que o engine nao encontra na tabela interna de Noto fonts.
    // O NotoColorEmoji.ttf esta carregado como fallback local (via FontLoader no
    // main.dart), cobrindo a maioria dos casos. Para os demais, suprimimos o
    // console.warn para evitar poluicao no console de producao.
    //
    // Tambem suprime "Cross-Origin-Opener-Policy policy would block the window.closed call"
    // emitido pelo Firebase Auth SDK (popup.ts:309) quando o servidor de preview
    // tem COOP: same-origin. O app ja usa signInWithRedirect nesses ambientes,
    // portanto o warning e cosmético e inofensivo.
    (function() {
      var _origWarn = console.warn.bind(console);
      console.warn = function() {
        var msg = arguments[0];
        if (typeof msg === 'string') {
          if (msg.indexOf('Could not find a set of Noto fonts') !== -1) return;
          if (msg.indexOf('Cross-Origin-Opener-Policy') !== -1 &&
              msg.indexOf('window.closed') !== -1) return;
        }
        return _origWarn.apply(console, arguments);
      };
    })();

    // Configura o Flutter Engine para buscar Noto fonts fallback do servidor local
    // em vez de fonts.gstatic.com, evitando requests externos e erros de CORS.
    // O servidor local retorna NotoColorEmoji.ttf para qualquer path solicitado,
    // garantindo cobertura maxima de glyphs sem dependencia de CDN externo.
    // Usa document.baseURI para respeitar o --base-href (/app/) do Flutter build.
    (function() {
      try {
        // document.baseURI inclui o base href correto (ex: "https://host/app/")
        // Isso garante que a URL inclua o prefixo /app/ em produção.
        var base = document.baseURI || (window.location.origin + '/app/');
        // Normaliza: garante que termine com /
        if (!base.endsWith('/')) base += '/';
        window.flutterConfiguration = {
          fontFallbackBaseUrl: base + 'assets/fonts/'
        };
      } catch(e) {
        window.flutterConfiguration = {
          fontFallbackBaseUrl: window.location.origin + '/app/assets/fonts/'
        };
      }
    })();
  </script>

    html, body { margin: 0; padding: 0; background: #0A1628; }

    /* Logo container */

      width: 110px;
      height: 110px;
      margin-bottom: 28px;

    .sw-logo-img {

/* Copyright */

30%  { width: 45%; }

100% { background-position: -200% 0; }

  <script>
    // Remove o splash nativo quando o Flutter terminar de renderizar o 1º frame.
    // Estratégia em 3 camadas para garantir que a splash só some quando o app
    // REALMENTE está pintado na tela (evita tela azul entre splash e conteúdo).
    (function() {
      var _splashRemoved = false;

      function removeSplash() {
        if (_splashRemoved) return;
        _splashRemoved = true;
        clearInterval(_pollInterval);
        clearTimeout(_fallbackTimer);
        var splash = document.getElementById('sw-splash');
        if (!splash) return;
        splash.classList.add('sw-fade-out');
        setTimeout(function() {
          if (splash.parentNode) splash.parentNode.removeChild(splash);
        }, 500);
      }

      // Método 1: evento flutter-first-frame (disparado pelo main.dart)
      // É o mais confiável — sinaliza que o 1º frame foi efetivamente pintado.
      window.addEventListener('flutter-first-frame', removeSplash, { once: true });

      // Método 2: polling robusto — detecta o canvas E verifica que tem pixels
      // Garante que o Flutter já pintou algo antes de remover a splash.
      var _pollInterval = setInterval(function() {
        // flt-glass-pane é o container raiz do Flutter web renderer
        var pane = document.querySelector('flt-glass-pane');
        if (!pane) return;

        // Verifica se o canvas interno já tem dimensão (foi pintado)
        var canvas = pane.shadowRoot
          ? pane.shadowRoot.querySelector('canvas')
          : pane.querySelector('canvas');

        if (canvas && canvas.width > 0 && canvas.height > 0) {
          clearInterval(_pollInterval);
          // Aguarda 350ms para garantir que o 1º frame completo foi pintado
          setTimeout(removeSplash, 350);
        }
      }, 200);

      // Método 3: fallback de segurança — 12s para conexões lentas (3G/4G ruim)
      // O main.dart.js tem ~5-8MB, pode demorar em redes móveis lentas.
      // Antes eram 4s — muito curto para 4G fraco, causava tela azul.
      var _fallbackTimer = setTimeout(function() {
        clearInterval(_pollInterval);
        removeSplash();
      }, 12000);
    })();
  </script>
