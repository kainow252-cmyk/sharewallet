<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Instalar ShareWallet</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: linear-gradient(160deg, #0A1628 0%, #0D3B2E 60%, #0A1628 100%);
      display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 24px;
    }
    .card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 24px;
      padding: 40px 32px 36px;
      max-width: 380px; width: 100%; text-align: center;
    }
    .logo { width:80px;height:80px;border-radius:20px;margin:0 auto 20px;display:block; }
    h1 { color:#fff;font-size:24px;font-weight:800;letter-spacing:-0.3px;margin-bottom:8px; }
    .subtitle { color:rgba(255,255,255,0.55);font-size:14px;line-height:1.5;margin-bottom:28px; }
    .info-row { display:flex;gap:10px;justify-content:center;margin-bottom:28px;flex-wrap:wrap; }
    .badge {
      background:rgba(0,229,180,0.10);border:1px solid rgba(0,229,180,0.25);
      border-radius:20px;padding:5px 13px;color:#00E5B4;font-size:12px;font-weight:600;
    }
    .btn-install {
      display:flex;align-items:center;justify-content:center;gap:10px;
      width:100%;padding:18px 24px;
      background:#00E5B4;color:#0A1628;
      font-size:17px;font-weight:800;
      border:none;border-radius:14px;cursor:pointer;
      text-decoration:none;
      transition:transform 0.15s, opacity 0.15s;
      letter-spacing:0.2px;
    }
    .btn-install:active { transform:scale(0.97);opacity:0.9; }
    .btn-install.loading {
      background:rgba(0,229,180,0.15);color:#00E5B4;pointer-events:none;
    }
    .btn-install.done { background:#00E5B4;color:#0A1628; }
    .steps { margin-top:28px;text-align:left; }
    .steps-title {
      color:rgba(255,255,255,0.4);font-size:11px;font-weight:600;
      letter-spacing:0.8px;text-transform:uppercase;margin-bottom:14px;text-align:center;
    }
    .step { display:flex;align-items:flex-start;gap:12px;margin-bottom:12px; }
    .step-num {
      min-width:24px;height:24px;border-radius:50%;
      background:rgba(0,229,180,0.15);border:1px solid rgba(0,229,180,0.3);
      color:#00E5B4;font-size:12px;font-weight:700;
      display:flex;align-items:center;justify-content:center;
    }
    .step-text { color:rgba(255,255,255,0.65);font-size:13px;line-height:1.5;padding-top:3px; }
    .step-text strong { color:rgba(255,255,255,0.9); }
    .footer { margin-top:28px;color:rgba(255,255,255,0.25);font-size:11px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { animation: spin 0.8s linear infinite; display:inline-block; }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="icons/Icon-192.png" alt="ShareWallet"
         onerror="this.style.display='none'">

    <h1>ShareWallet</h1>
    <p class="subtitle">Transforme conexões em receita recorrente</p>

    <div class="info-row">
      <span class="badge">v1.0.4</span>
      <span class="badge">Android</span>
      <span class="badge">~60 MB</span>
    </div>

    <a id="btn"
       class="btn-install"
       href="https://github.com/kainow252-cmyk/sharewallet/releases/download/v1.0.4/ShareWallet-v1.0.4.apk"
       download="ShareWallet.apk">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
        <path d="M5 20h14v-2H5v2zm7-18v10.17l-3.59-3.58L7 10l5 5 5-5-1.41-1.41L13 12.17V2h-2z"/>
      </svg>
      Baixar e Instalar
    </a>

    <div class="steps">
      <p class="steps-title">Como instalar</p>
      <div class="step">
        <div class="step-num">1</div>
        <div class="step-text">Toque em <strong>Baixar e Instalar</strong></div>
      </div>
      <div class="step">
        <div class="step-num">2</div>
        <div class="step-text">Quando aparecer <strong>"Permitir desta fonte?"</strong> → toque <strong>Permitir</strong></div>
      </div>
      <div class="step">
        <div class="step-num">3</div>
        <div class="step-text">Toque em <strong>Instalar</strong> → app abre automaticamente ✅</div>
      </div>
    </div>

    <p class="footer">© 2026 ShareWallet · Todos os direitos reservados</p>
  </div>

  <script>
    var btn = document.getElementById('btn');
    btn.addEventListener('click', function() {
      setTimeout(function() {
        btn.innerHTML = '<span class="spin">⟳</span>&nbsp; Baixando... abra o arquivo ↓';
        btn.classList.add('loading');
      }, 300);
      setTimeout(function() {
        btn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg> Arquivo baixado — abra para instalar';
        btn.classList.remove('loading');
        btn.classList.add('done');
        btn.removeAttribute('href');
        btn.removeAttribute('download');
      }, 4000);
    });
  </script>
</body>
</html>
